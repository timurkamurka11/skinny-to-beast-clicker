name: Generate Fat Man Layered Art 3.6

# The workflow is branch-scoped so generated PNG commits cannot affect main.
on:
  push:
    branches:
      - fix/real-fat-man-layered-art-3-6
    paths:
      - Tools/FatManLayeredArt/generate_layered_art.py
      - Tools/FatManLayeredArt/refine_layered_art.py
      - Tools/FatManLayeredArt/validate_layered_art.py
      - Assets/Resources/Characters/FatMan/fat-man-turnaround-reference.png
      - .github/workflows/generate-fat-man-layered-art.yml
  pull_request:
    branches:
      - main
    paths:
      - Tools/FatManLayeredArt/generate_layered_art.py
      - Tools/FatManLayeredArt/refine_layered_art.py
      - Tools/FatManLayeredArt/validate_layered_art.py
      - .github/workflows/generate-fat-man-layered-art.yml
      - Assets/Scripts/Gameplay/CharacterLayeredRigController.cs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-layered-art:
    if: github.head_ref == 'fix/real-fat-man-layered-art-3-6' || github.ref_name == 'fix/real-fat-man-layered-art-3-6'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/real-fat-man-layered-art-3-6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Generate separate transparent body layers
        run: python Tools/FatManLayeredArt/generate_layered_art.py

      - name: Enforce anatomical bounds and remove stray fragments
        run: python Tools/FatManLayeredArt/refine_layered_art.py

      - name: Validate layered-art contract
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python Tools/FatManLayeredArt/validate_layered_art.py 2>&1 | tee Assets/Resources/Characters/FatManLayered/Generated/validation-report.txt

      - name: Commit generated assets and validation report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Resources/Characters/FatManLayered/Generated
          if git diff --cached --quiet; then
            echo "Generated art is already current."
          else
            git commit -m "Generate inspected Patch 3.6 layered PNG assets [skip ci]"
            git push origin HEAD:fix/real-fat-man-layered-art-3-6
          fi

      - name: Fail when layered-art validation failed
        if: steps.validate.outcome == 'failure'
        run: exit 1
